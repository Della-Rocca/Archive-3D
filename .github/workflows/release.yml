name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Universal (Intel + Apple Silicon)
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          
          # Windows: x86_64 (Classique)
          - platform: windows-latest
            args: ""
            rust_targets: "x86_64-pc-windows-msvc"
          
          # Windows: ARM64
          - platform: windows-latest
            args: "--target aarch64-pc-windows-msvc"
            rust_targets: "aarch64-pc-windows-msvc"
            
          # Linux: x86_64
          - platform: ubuntu-22.04
            args: ""
            rust_targets: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Archive 3D v__VERSION__"
          releaseBody: "Nouvelle version de Archive 3D. Téléchargez le fichier correspondant à votre système ci-dessous, ou laissez l''application se mettre à jour automatiquement."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
